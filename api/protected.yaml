openapi: "3.0.3"
info:
  title: Protected API
  version: "1.0.0"
servers:
  - url: http://localhost:8080/api
security:
  - BearerAuth: []
paths:
  /channels:
    get:
      summary: チャンネル一覧取得
      operationId: getChannels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
  /users:
    get:
      summary: ユーザー一覧取得
      operationId: getUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Channel:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
